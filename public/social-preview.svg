<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">auroLab music production tools</title>
  <desc id="description">Social preview for auroLab, a private browser-based toolkit for music producers.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="32" x2="1090" y2="598" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102b49" />
      <stop offset="0.55" stop-color="#071321" />
      <stop offset="1" stop-color="#030711" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(960 80) rotate(132) scale(510 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a6cff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#8a6cff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9c0ff" stroke-opacity="0.08" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#background)" />
  <rect width="1200" height="630" rx="32" fill="url(#glow)" />
  <rect width="1200" height="630" rx="32" fill="url(#grid)" />
  <rect x="28" y="28" width="1144" height="574" rx="24" fill="none" stroke="#c9c0ff" stroke-opacity="0.2" />

  <g filter="url(#shadow)">
    <rect x="72" y="76" width="156" height="156" rx="38" fill="#0a1b2e" stroke="#8a6cff" stroke-opacity="0.66" />
    <image href="logo.svg" x="102" y="106" width="96" height="96" />
  </g>

  <text x="264" y="153" fill="#c9c0ff" font-family="Montserrat, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">auroLab</text>
  <text x="266" y="201" fill="#aab3c8" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2">MUSIC PRODUCTION TOOLS</text>

  <text x="72" y="336" fill="#f7f8ff" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="700">Free music production tools</text>
  <text x="72" y="394" fill="#f7f8ff" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="700">for producers.</text>

  <g fill="#d8d1ff" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="600">
    <text x="78" y="491">DELAY &amp; REVERB</text>
    <text x="309" y="491">METRONOME</text>
    <text x="491" y="491">TAP TEMPO</text>
    <text x="672" y="491">BPM &amp; KEY</text>
    <text x="855" y="491">CAMELOT</text>
    <text x="1014" y="491">MIDI</text>
  </g>
  <g fill="#8a6cff">
    <circle cx="72" cy="485" r="4" />
    <circle cx="303" cy="485" r="4" />
    <circle cx="485" cy="485" r="4" />
    <circle cx="666" cy="485" r="4" />
    <circle cx="849" cy="485" r="4" />
    <circle cx="1008" cy="485" r="4" />
  </g>

  <rect x="72" y="536" width="320" height="42" rx="21" fill="#8a6cff" fill-opacity="0.16" stroke="#8a6cff" stroke-opacity="0.6" />
  <text x="94" y="564" fill="#c9c0ff" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">FREE · PRIVATE · IN YOUR BROWSER</text>
</svg>
